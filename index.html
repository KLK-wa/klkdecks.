<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klk - Decks & Railings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #141414;
            color: #f0ece6;
            line-height: 1.5;
        }
        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
        }
        nav .logo {
            font-size: 1.6rem;
            letter-spacing: 6px;
            font-weight: 300;
        }
        nav .links a {
            color: #f0ece6;
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        nav .quote {
            border: 1px solid #f0ece6;
            padding: 10px 20px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        /* HERO */
        .hero {
            display: flex;
            min-height: 420px;
            background-image: url(https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1600&q=80');
            background-size: cover;
            background-position: center;
            align-items: flex-end;
            padding: 40px;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .hero p { 
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }
        /* CALCULATOR */
        .calculator {
            display: block;
            text-align: left;
            margin-top: 15px;
            color: #d4cfc7;
        }
        .result {
            margin-top: 20px;
            font-size 1.3rem;
            color: #f5f5f5;
        }
    </style>
</head>
<body>
    <header>
         <h1>klk</h1>
         <p>Quality Decks & Railings in Washington</p>
         <button> Get a Free Quote</button>
    </header>

    <div class="calculator">
        <h2>Estimate Your Deck</h2>
        <label>Length (feet)</label>
        <input type="number" id="length" placeholder="e.g. 20">
        <label>Width (feet)</label>
        <input type="number" id="width" placeholder="e.g. 12">
        <button onclick="calculate()">Calculate</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        function calculate() {
            var length = document.getElementById('length').value;
            var width = document.getElementById('width).value;
            var area = length * width;
            var price = area * 25;
            document.getElementById('result').innerHTML = "Area: " + area + " sq ft - Est. $" + price;
        }
    </script>
</body>
</html>
