<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>klk — Decks & Railings</title>
   <style>
       * { margin: 0; padding: 0; box-sizing: border-box; }
       body {
           font-family: 'Helvetica Neue', Arial, sans-serif;
           background-color: #0f0f0f;
           color: #ece7df;
           line-height: 1.6;
       }
       /* NAV */
       nav {
           display: flex; justify-content: space-between; align-items: center;
           padding: 30px 60px;
       }
       nav .logo { font-size: 2.6rem; letter-spacing: 12px; font-weight: 300; }
       nav .links a {
           color: #ece7df; text-decoration: none; margin-left: 35px;
           font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase;
       }
       nav .quote {
           border: 1px solid #ece7df; padding: 11px 22px;
           font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase;
       }
       /* HERO */
       .hero {
           position: relative; min-height: 85vh; display: flex; align-items: flex-end;
           background-image: url('Unknown.jpeg');
           background-size: cover; background-position: center;
           padding: 70px;
       }
       .hero::before {
           content: ''; position: absolute; inset: 0;
           background: linear-gradient(to top, rgba(15,15,15,0.92), rgba(15,15,15,0.25));
       }
       .hero .content { position: relative; z-index: 2; }
       .hero h1 {
           font-size: 4rem; font-weight: 300; letter-spacing: 6px;
           text-transform: uppercase; line-height: 1.1;
       }
       .hero p { font-size: 0.9rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.75; margin-top: 18px; }
       .loc {
           position: absolute; top: 50%; right: 60px; transform: translateY(-50%);
           writing-mode: vertical-rl; font-size: 0.7rem; letter-spacing: 4px; opacity: 0.6;
       }
       /* MATERIALS CAROUSEL */
       .materials { max-width: 1100px; margin: 90px auto; padding: 0 40px; }
       .materials h2 { font-size: 1rem; letter-spacing: 5px; text-transform: uppercase; font-weight: 300; margin-bottom: 15px; color: #8a857c; }
       .materials h3 { font-size: 2.2rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }
       .carousel { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; }
       .carousel::-webkit-scrollbar { height: 4px; }
       .carousel::-webkit-scrollbar-thumb { background: #333; }
       .swatch {
           flex: 0 0 auto; width: 110px; cursor: pointer; text-align: center;
           transition: all 0.3s ease;
       }
       .swatch img {
           width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
           border: 2px solid #2a2a2a; transition: all 0.3s ease;
       }
       .swatch p {
           font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;
           color: #8a857c; margin-top: 10px;
       }
       .swatch.selected img {
           border: 3px solid #ece7df; transform: scale(1.15);
           box-shadow: 0 0 25px rgba(236,231,223,0.3);
       }
       .swatch.selected p { color: #ece7df; }
       .selected-info {
           margin-top: 35px; padding: 25px; background-color: #141414;
           border: 1px solid #242424; text-align: center;
       }
       .selected-info h4 { font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 300; }
       .selected-info p { font-size: 0.8rem; color: #8a857c; margin-top: 8px; }
       footer { text-align: center; padding: 50px; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #666; }
       @media (max-width: 700px) {
           nav { padding: 20px; flex-wrap: wrap; gap: 15px; }
           nav .links a { margin-left: 15px; }
           .hero { padding: 30px; min-height: 60vh; }
           .hero h1 { font-size: 2.2rem; }
       }
   </style>
</head>
<body>
   <nav>
       <div class="logo">klk</div>
       <div class="links">
           <a href="#materials">Materials</a>
           <a href="#contact">Contact</a>
       </div>
       <div class="quote">Get a Free Quote</div>
   </nav>

   <div class="hero">
       <div class="content">
           <h1>Decks &amp; Railings.<br>Untamed.<br>Unchanged.</h1>
           <p>Quality Craftsmanship in Washington</p>
       </div>
       <div class="loc">SEATTLE · WASHINGTON</div>
   </div>

   <div class="materials" id="materials">
       <h2>03 — Materials</h2>
       <h3>Choose Your Wood</h3>
       <div class="carousel" id="carousel"></div>
       <div class="selected-info" id="selectedInfo">
           <h4>Select a material</h4>
           <p>Tap a circle to see the details</p>
       </div>
   </div>

   <footer>klk — Decks &amp; Railings · Washington</footer>

   <script>
       var materials = [
           { img: 'Unknown.jpeg', name: 'Sample 1' },
           { img: 'image0.jpeg', name: 'Sample 2' },
           { img: 'image2.jpeg', name: 'Sample 3' },
           { img: 'image3.jpeg', name: 'Sample 4' },
           { img: 'image5.jpeg', name: 'Sample 5' },
           { img: 'image7.jpeg', name: 'Sample 6' },
           { img: 'image9.jpeg', name: 'Sample 7' }
       ];

       var carousel = document.getElementById('carousel');
       var selectedInfo = document.getElementById('selectedInfo');

       materials.forEach(function(m, i) {
           var div = document.createElement('div');
           div.className = 'swatch';
           div.innerHTML = '<img src="' + m.img + '"><p>' + m.name + '</p>';
           div.onclick = function() {
               var all = carousel.children;
               for (var j = 0; j < all.length; j++) all[j].classList.remove('selected');
               div.classList.add('selected');
               selectedInfo.innerHTML = '<h4>' + m.name + '</h4><p>Selected — tap to continue</p>';
           };
           carousel.appendChild(div);
       });
   </script>
</body>
</html>
