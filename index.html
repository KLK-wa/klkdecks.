<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klk - Decks & Railings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #141414;
            color: #f0ece6;
            line-height: 1.5;
        }
        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
        }
        nav .logo {
            font-size: 1.6rem;
            letter-spacing: 6px;
            font-weight: 300;
        }
        nav .links a {
            color: #f0ece6;
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        nav .quote {
            border: 1px solid #f0ece6;
            padding: 10px 20px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        /* HERO */
        .hero {
            display: flex;
            min-height: 420px;
            background-image: url(https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1600&q=80');
            background-size: cover;
            background-position: center;
            align-items: flex-end;
            padding: 40px;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .hero p { 
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }
        /* CALCULATOR */
        .calculator {
            max-width: 420px;
            margin: 60px auto;
            padding: 40px;
            background-color: #1c1c1c;
            border: 1px solid #2a2a2a;
        }
        .calculator h2 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 25px;
            text-align: center;
        }
        .calculator label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 18px;
            color: #aaa;
        }
        .calculator imput {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            font-size: 1rem;
            background-color: #141414;
            border: 1px solid #333;
            color: #f0ece6;
        }
        .calculator button {
            width: 100%
            margin-top: 25px;
            padding: 14px;
            background-color: #f0ece6;
            color: #141414;
            border: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
        }
    </style>
</head>
<body>
    </nav>
         <div class="logo">klk</div>
         <div class="links">
             <a href="#">Home</a>
             <a href="#">Gallery</a>
             <a href="#">Materials</a>
             <a href="#">Contact</a>
         </div>
         <div class="quote">Get a Free Quote</div>
     </nav>

     <div class="Hero">
         <div>
             </h1>Decks & Railings</h1>
             <p>Quality Craftsmanship in Washington</p>
         </div>
     </div>

    <div class="calculator">
        <h2>Estimate Your Deck</h2>
        <label>Length (feet)</label>
        <input type="number" id="length" placeholder="e.g. 20">
        </label>Width (feet)</label>
        <input type="number" id="width" placeholder="e.g. 12">
        <button onclick="calculate()">Calculate</button>
        <div class="result" id="result"></div>
    </div>

    <footer>klk - Decks & Railings · Washington</footer>

    <script>
        function calculate() {
            var length = document.getElementById('length').value;
            var width = document.getElementById('width').value;
            if (length > 0 && width > 0) {
                var area = length * width;
                var price = area * 25;
                document.getElementById('result').innerHTML = area + " sq ft - Est. $" + price;
            } else {
                document.getElementById('result').innerHTML = "Enter both measurements";
            }
        }
    </script>
</body>
</html>
